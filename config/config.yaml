# ─── Configuration ───
random_seed: 42

# ─── Data Splitting ───
test_size: 0.2
validation_size: 0.1

# ─── Target ───
target: Weekly_Sales

# ─── Model Defaults ───
model:
  random_forest:
    n_estimators: 300
    max_depth: 20
    random_state: 42

# ─── File Paths ───
paths:
  raw_data: data/raw/walmart_sales.parquet
  interim_data: data/interim/cleaned.parquet
  processed_data: data/processed/features.parquet
  train_data: data/processed/train.parquet
  validation_data: data/processed/validation.parquet
  test_data: data/processed/test.parquet
  model: models/best_model.joblib
  scaler: models/scaler.joblib
  encoder: models/encoder.joblib
  feature_columns: models/feature_columns.json
